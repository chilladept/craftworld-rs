[package]
name = "lbp-sim"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Runtime only (docs/runtime-research.md, R2): the parsing crates never depend on this.
[dependencies]
lbp-level.workspace = true
bevy = { version = "=0.19.1", default-features = false, features = ["std"] }
avian2d = { version = "=0.7.0", default-features = false, features = ["2d", "f32", "parry-f32", "xpbd_joints", "enhanced-determinism"] }

[dev-dependencies]
lbp-catalog.workspace = true
lbp-preview.workspace = true
serde_json.workspace = true
