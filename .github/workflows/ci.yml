name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Non-GUI crates only; lbp-bevy-viewer and lbp-viewer are excluded (see docs/d72-ci.md).
  CRATES: >-
    -p lbp-core -p lbp-io -p lbp-archive -p lbp-resource -p lbp-texture
    -p lbp-mesh -p lbp-catalog -p lbp-preview -p lbp-cli -p lbp-gooey
    -p lbp-level -p lbp-script-vm -p lbp-ui-script -p lbp-runtime -p lbp-sim

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to the PC toolchain so new Clippy lints don't surprise branches.
      # Bump together with the PC (docs/workflow.md section 7).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.99.0-
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test -q --locked $CRATES
      - name: Clippy
        run: cargo clippy -q --locked $CRATES --all-targets -- -D warnings

  # The viewers only compile here (no display). Runs on main pushes only to save
  # Actions minutes; the PC builds both viewers before every merge.
  viewers:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      # Bevy/winit/rodio need these; fontconfig is for the text browser's OS font
      # fallback (the viewers job was red on main from 2026-10-08 without it).
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-viewers-${{ runner.os }}-1.99.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-viewers-${{ runner.os }}-1.99.0-
      - name: Check viewers
        run: cargo check -q --locked -p lbp-viewer -p lbp-bevy-viewer --all-targets

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tests
